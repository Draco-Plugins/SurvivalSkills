# Fishing skill loot tables
#
# Materials are listed by their Bukkit Material enum name. Duplicate entries
# increase the drop probability (weighting); the random draw picks a single
# index from the list, so more copies means a more frequent drop.
#
# Enchantments use their namespaced key (e.g. "minecraft:power") mapped to the
# maximum drop level. Server admins may tune these values without recompiling;
# the file is created from these defaults on first load.
#
# The exotic table lists identifiers handled in code (custom items that cannot
# be expressed as plain materials); admins may remove entries to disable drops.

